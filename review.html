<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/review.css">
  <script src="scripts/review.js" defer></script>
  <title>Review Confirmation</title>

</head>
<body>

<div class="container">
  <h2>Review Submitted</h2>

  <div class="field">
    <div class="label">Product Name:</div>
    <div id="product" class="value"></div>
  </div>

  <div class="field">
    <div class="label">Rating:</div>
    <div id="rating" class="value"></div>
  </div>

  <div class="field">
    <div class="label">Date of Installation:</div>
    <div id="installDate" class="value"></div>
  </div>

  <div class="field">
    <div class="label">Useful Features:</div>
    <div id="features" class="value"></div>
  </div>

  <div class="field">
    <div class="label">Written Review:</div>
    <div id="review" class="value"></div>
  </div>

  <div class="field">
    <div class="label">Submitted By:</div>
    <div id="username" class="value"></div>
  </div>

  <a class="btn-back" href="index.html">Back to Form</a>

</div>

</body>
</html>
