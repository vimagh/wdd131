<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review</title>

</head>
<body>

<header>
  <h1>Product Review Form</h1>
</header>


<form method="get" action="review.html">

  <!-- PRODUCT NAME -->
  <label for="product">Product Name</label>
  <select id="product" name="product" required>
    <option value="" disabled selected>Select a Product ...</option>
  </select>

  <!-- RATING -->
  <label>Overall Rating</label>

  <div class="inline-group">
    <label for="rate1">
      <input type="radio" id="rate1" name="rating" value="1" required> 1 Star
    </label>

    <label for="rate2">
      <input type="radio" id="rate2" name="rating" value="2" required> 2 Stars
    </label>

    <label for="rate3">
      <input type="radio" id="rate3" name="rating" value="3" required> 3 Stars
    </label>

    <label for="rate4">
      <input type="radio" id="rate4" name="rating" value="4" required> 4 Stars
    </label>

    <label for="rate5">
      <input type="radio" id="rate5" name="rating" value="5" required> 5 Stars
    </label>
  </div>

  <!-- DATE -->
  <label for="installDate">Date of Installation</label>
  <input type="date" id="installDate" name="installDate" required>

  <!-- FEATURES -->
  <label>Useful Features</label>

  <div class="inline-group">
    <label for="durability">
      <input type="checkbox" id="durability" name="features" value="Durability"> Durability
    </label>

    <label for="ease">
      <input type="checkbox" id="ease" name="features" value="Ease of Use"> Ease of Use
    </label>

    <label for="performance">
      <input type="checkbox" id="performance" name="features" value="Performance"> Performance
    </label>

    <label for="design">
      <input type="checkbox" id="design" name="features" value="Design"> Design
    </label>
  </div>

  <!-- REVIEW -->
  <label for="review">Written Review (Optional)</label>
  <textarea id="review" name="review"></textarea>

  <!-- USERNAME -->
  <label for="username">Your Name (Optional)</label>
  <input type="text" id="username" name="username">

  <input type="submit" value="Post Review">

</form>

<footer>
  ©2025 Product Review System
  <p>&copy; <span id="year"></span> | Last Modified: <span id="lastModified"></span></p>
</footer>

</body>
</html>
